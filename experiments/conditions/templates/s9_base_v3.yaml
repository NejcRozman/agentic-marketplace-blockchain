# S7 — the base config every generated cell is a delta over (§D).
#
# Not runnable on its own: `generate_s9_cells.py` overwrites the id, the
# reputation weight, the arms and the log directories per cell. Edit settings
# that should hold for EVERY cell here; edit per-cell variation in
# `s9_matrix.yaml`.
#
# Dataset **v3** (30 requirements, 90 recordings, medium tier, per-prompt
# retrieval rounds measured). v2 has no rounds column, so the decomposed arm
# cannot be scored against ground truth on it.
#
# Was `s7_blockA_centre_xvh.yaml` (S7-era), from when block A's centre cell doubled as
# the pilot. That cell is now generated like any other and the pilot is settled
# (§E.5), so the file is named for what it actually is.

experiment:
  id: "s9_base_v3"
  name: "S7 base (v3)"
  description: "base config for the S7 cell generator; not run directly"
  research_question: "does_the_decomposed_llm_arm_beat_its_opponent"
  duration_timeout: 5400

  # S7 §A.1 — the one number every agent derives its RNG from.
  run_seed: 1007
  # S7 §A.2 — deterministic sampling. The seed is S5's frozen constant: the
  # estimator must sample exactly as the probe that measured its sigma did.
  llm_temperature: 0
  llm_sampling_seed: 20260804

blockchain:
  network: "anvil"
  rpc_url: "http://localhost:8545"
  fork_network: "sepolia"
  infura_key_env: "INFURA_API_KEY"
  # Starting reputation, both providers. Lowered 84 -> 80 on 2026-09-07.
  #
  # Reputation is an average of delivered quality ratings, so it converges to the
  # population mean. Measured over block E's 80 arm-runs it settles at **81.45**
  # (sd 1.55), against dataset v3's medium-tier quality mean of **81.46** — the
  # same number. 84 was the *median* rating, which is the wrong statistic for a
  # quantity that averages, so every run began 2.55 points above its own
  # attractor and drifted down.
  #
  # That matters here specifically because `rw` weights reputation in the auction
  # score and block B sweeps rw 20 -> 80: a systematic drift is weighted more at
  # high rw, i.e. it interacts with the factor block B measures. Both arms drift
  # identically so the paired difference was protected, but the confound is free
  # to remove. 80 starts 1.45 *below* the attractor rather than 2.55 above.
  initial_reputation_default: 80

  # S7 §A.6 P5 — start from a local snapshot of a chain forked once. No
  # --fork-url is passed at all, so a run cannot be throttled or failed by
  # Infura, and every run starts from byte-identical state.
  state_snapshot: "experiments/chain/s7_base.json"
  # D8 — the height the snapshot was taken at. Kept for provenance and as the
  # fallback if the snapshot is rebuilt.
  fork_block_number: 11523942

  contracts:
    reverse_auction: null
    identity_registry: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
    reputation_registry: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
    payment_token: null

  accounts:
    main_account: "${BLOCKCHAIN_PRIVATE_KEY}"
    deployer: "${BLOCKCHAIN_PRIVATE_KEY}"
    consumer: "${BLOCKCHAIN_CONSUMER_PRIVATE_KEY}"
    providers:
      - "${BLOCKCHAIN_PRIVATE_KEY}"

    consumer_funding:
      eth_amount: 1000000000000000000  # 1 ETH
      usdc_amount: 1000000000          # 1000 USDC

agents:
  consumer:
    count: 1
    agent_id: null
    private_key: null
    eligible_providers: null

    config:
      # Discovery latency is part of the commit-window budget: the provider can
      # only bid once it has polled and seen the auction. At 5s it was the
      # dominant term and every bid arrived past the freshness gate (§A.6.5).
      check_interval: 2
      check_interval_jitter: 0.5
      max_budget: 1000000
      # S7 §A.6.5 — wall clock only, no economics. 40/20 was the previous
      # setting; 10/5 is the spec's starting candidate and the cheapest 4x on
      # the 540-hour serial total. Gate G-E is the pilot-wide assertion that no
      # agent ever misses a phase at these values; raise them if it fires.
      # 20s, not 10s — arm X's estimator call runs INSIDE this window.
      # Measured (experiments/scripts/measure_estimator_latency.py, 10 calls per
      # model, $0.14): gpt-4o-mini 2.84s median / 3.42s p95, gpt-oss-20b 5.00s /
      # 6.25s, gpt-5.4-mini 3.31s / 4.71s, gpt-5.4 8.08s / 8.81s.
      #
      # Budget = poll 1s + jitter 1.5s + LLM + tx 0.6s + gate 2s, so the frontier
      # tier needs ~14s and even gpt-4o-mini needs ~8.5s. A 10s window would
      # starve the frontier arm of participation, which reads exactly like "the
      # expensive model cannot pay for itself" — the thing block A must measure
      # honestly rather than manufacture. 20s leaves ~6s for a tail that 10 calls
      # cannot see.
      #
      # Both agents in a cell share the window: it is a property of the auction,
      # not the agent, so no arm gets a timing advantage.
      commit_duration: 20
      # 6s with the 2s gate leaves a 4s discovery target. Measured over 1445
      # provider loop cycles after the scan fix: p50 1.08s, p95 2.09s, p99 2.92s,
      # max 3.52s — so 0/1445 cycles overrun a 4s target, where a 3s target (5s
      # window) missed 12. This is the cheapest window with no measured loss;
      # 10s would cost 3.8h of campaign wall clock for the same zero.
      #
      # The margin over the worst observed cycle is 0.48s, so this holds for the
      # arms that make no LLM call. Arm X runs its estimator inside this same
      # loop, which shifts the whole distribution right — expect to raise it
      # there, and let `missed_reveals` (gate G-E) decide by how much.
      reveal_duration: 6
      reputation_weight: 20

    behavior:
      service_source_mode: "sampled_dataset"
      # Dataset v2 — the only simulated component of S7.
      #
      # `final/`, NOT the parent directory. The parent is append-only and holds
      # 19 collections: seven pilot arms, a checkpoint, a model-per-tier
      # experiment and the generation stages, at different effort budgets and
      # prompt templates — 116 requirements of which 50 have no runs at all.
      # finalize_dataset_v3.py says it outright: "anything that loads the
      # directory naively is pooling incompatible data."
      #
      # `final/` is the canonical dataset; see docs/s7_v3_handoff.md §2:
      # 30 requirements (20 dev / 10 held-out), 3 tiers, 3 repeats, 270 runs,
      # complete coverage.
      sampled_dataset_dir: "data/dataset/final"
      sampled_dataset_id: "executor_tier_dataset_v3"
      # Which of a requirement's three recordings a job replays.
      #
      # `round_robin` starts every cursor at 0 and `service_selection:
      # shuffled_pass` draws each requirement exactly once per 30-auction run,
      # so every job replayed **repeat 1**: two thirds of dataset v2 were
      # unreachable, execution cost was identical in every run (zero
      # across-seed variance), and a perfect predictor of the 3-repeat mean
      # still scored sigma 0.107 against what the agent actually paid, as a
      # fixed per-requirement bias.
      #
      # Seeded from the run seed plus the agent id, so a run stays reproducible
      # while different seeds now differ in realised cost, not only in arrival
      # order. The runner copies this to every provider
      # (`shared_sampled_dataset_args`); it is read from the consumer block
      # only, so it must be set here.
      sampled_dataset_run_selection_mode: "random"
      # S7 §A.3 — one seeded pass, no requirement seen twice in a run.
      service_selection: "shuffled_pass"
      # The horizon. It equals the canonical dataset exactly (30 requirements),
      # so a 31st auction raises rather than silently reusing a requirement the
      # agent has already executed and priced (§B.3).
      #
      # L2 executes at the medium tier only: architecture "2" is one_way
      # coupling, so no effort tier is committed on-chain and the replay falls
      # back to default_effort_tier=medium. The low and high runs in the dataset
      # are unused here; they are what block C's ablation would need.
      sampled_dataset_pass_limit: 30
      auto_create_auction: true
      num_auctions: 30
      auto_monitor: true
      inter_auction_delay: 2

  providers:
    count: 2
    agent_ids: [null, null]
    private_keys: null

    config:
      # S7 §A.6.5 / gate G-E. The default is 10s, which on a 10s commit window
      # rejects every bid: `time_remaining` can never exceed the window itself.
      # 2s clears the measured p95 commit latency (1.17s) with margin; the
      # pilot's late-commit and missed-reveal counters are what tighten or
      # raise it.
      # S7 §C — the abstention gate, on for every arm in the cell. This is S6's
      # rung O2c verbatim, down to the field name: decline when
      # `believed_cost + overhead` exceeds the HIGHEST price this agent has
      # itself won at, and bid unconditionally until it has won something.
      #
      # Nothing is fitted and nothing leaks from the dataset (§C.1 — kappa is
      # deliberately not fitted on dev requirements): the threshold is revenue
      # the market has already paid this agent.
      #
      # Every arm can fire it, H included, because it needs only a cost belief
      # and not a task-conditional estimate. O2c-on/off therefore moves all
      # three arms, which is what makes the §C ablation a clean contrast.
      action_space: "price_or_decline"
      bid_freshness_min_seconds: 2
      # S7 §A.6.5. The provider's loop used to poll on a hardcoded 5s, which
      # cannot reliably catch a 5s reveal window — that is how a committed bid
      # gets forfeited. Anvil mines every 1s, so polling at 1s reacts within one
      # block of a WebSocket event subscription, without a WS connection to
      # manage on the layer that carries the money.
      provider_monitor_interval: 1.0
      # Priors set from dataset v2's realized means (low $0.0322, medium
      # $0.0563, high $0.1018), rounded. They were 0.08/0.10/0.20, inherited
      # from an h3 smoke config and ~2x the truth — every arm would have spent
      # its opening auctions converging down from a wrong level, and
      # `history_tier_level` is exactly the quantity the estimator's multiplier
      # scales (§B.3).
      initial_service_execution_cost: 0.06
      initial_service_execution_cost_low: 0.03
      initial_service_execution_cost_medium: 0.06
      initial_service_execution_cost_high: 0.10
      # The tier-less fallback. Inert — all three tiers are set explicitly below —
      # but it is medium's fallback, so leaving it at 84 beside a medium of 80
      # reads as a contradiction rather than a default.
      initial_quality_rating: 80
      initial_quality_rating_low: 76
      # 84 -> 80, matching initial_reputation_default above. Near-inert for S9:
      # it reaches `PolicyParams.quality_prior_by_tier`, which only
      # `h3_strategy_2` reads, and every S9 arm runs `h2_strategy_3`. Its other
      # path is the estimator's quality line, and `prompts_decomposed.py` — what
      # X_d actually sends — never renders quality. Changed for consistency, not
      # for effect.
      initial_quality_rating_medium: 80
      initial_quality_rating_high: 87
      initial_non_execution_cost_per_participation: 0.006
      gas_cost_mode: "fixed"
      gas_price_gwei: 121
      eth_price_usd: 0.1

    behavior:
      auto_bid: true
      auto_execute: true
      auto_complete: true

    groups:
      # X_d — the decomposed arm (§B.3, s7_v3_handoff.md §1). One structured
      # LLM call per auction elicits a retrieval DEPTH per prompt, which a
      # two-parameter fit on the agent's own completed jobs turns into dollars
      # (cost = a*n_prompts + b*sum(rounds)). It replaced the `hybrid` arm,
      # which elicited a cost multiplier directly; `hybrid` is retained in code
      # for gate G-B and the S5 prompt-parity test but is in no cell.
      # cost_multiplier; the controller underneath is h2_strategy_3, unchanged.
      # The reasoning cost flows into this agent's own cost basis, so it bids off
      # a higher basis and has to earn the call back inside the mechanism.
      - name: "X_decomposed"
        ratio: 1
        behavior:
          architecture: "2"
          # The controller is h2_strategy_3, unchanged and identical to H's.
          # `cost_estimator` is the only difference between the arms —
          # one structured LLM call per auction supplies a cost_multiplier, and
          # `cost_multiplier == 1.0` reproduces H bit-for-bit (gate G-B).
          reasoning_mode: "heuristic"
          cost_estimator: "decomposed"
          heuristic_strategy: "h2_strategy_3"
          heuristic_min_margin: 0.20
          heuristic_max_margin: 0.50
          blockchain_llm_model: "openai/gpt-4o-mini"

      # H — the floor (§B.1). Same controller, own historic cost average, no
      # estimator, no calls, $0. The identity target for test_s7_hybrid_identity.
      - name: "H_heuristic"
        ratio: 1
        behavior:
          architecture: "2"
          reasoning_mode: "heuristic"
          heuristic_strategy: "h2_strategy_3"
          heuristic_min_margin: 0.20
          heuristic_max_margin: 0.50

experiment_flow:
  phases:
    - name: "setup"
      description: "Start Anvil from snapshot, deploy contracts, register agents"
      timeout: 180

    - name: "agents_start"
      description: "Launch consumer and provider agents"
      timeout: 60

    - name: "experiment_run"
      description: "Agents operate until 30 auctions complete"
      stopping_criteria:
        type: "completed_auctions"
        target: 30
        poll_interval: 5
        max_timeout: 5400

  # Never below 30: that is the instrument's horizon and the crossover regime
  # lives inside it (§A.6.5).
  target_auctions: 30

monitoring:
  metrics:
    - auction_created
    - bids_received
    - auction_winner
    - service_executed
    - service_completed
    - reputation_updated
    - final_reputations
    - gas_costs
    - timing

  logs:
    directory: "data/runs/logs/s7_base_v3"
    format: "json"
    level: "INFO"

  output:
    directory: "data/runs/metrics/s7_base_v3"
    format: "json"

api_keys:
  openrouter_api_key_env: "OPENROUTER_API_KEY"
  pinata_api_key_env: "PINATA_API_KEY"
  pinata_secret_env: "PINATA_SECRET_KEY"
