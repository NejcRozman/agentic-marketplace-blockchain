# Dataset v3 collection: dataset v2's requirements, re-executed with the
# per-prompt retrieval-round counter persisted (medium tier only).
#
# v3 exists for one column. v2's executor tracked `retrieval_rounds_used` per
# prompt and logged it, but only {prompt, response} was ever stored, so the
# effort channel the decomposed estimator predicts cannot be scored against
# what actually happened. Everything else is held fixed — same requirement
# text (reused, not regenerated), same effort budget, same models — so v3
# differs from v2's medium cell in instrumentation and in nothing else.
#
# ⚠️ `effort_budget.retrieval_rounds.medium` is 3, so realized rounds are
# capped at 3. Whether they vary or saturate is the pilot's question.
#
# The 30 slots come from experiments/estimation/requirement_plan_v2.json - documents,
# prompt counts, breadths, length bands and demanded depth are all fixed by the plan,
# so the 10 matched pairs are constructed rather than sampled.
#
# Keep dataset_id fixed and use a new collection_id to append or resume; the collector
# is append-only by design.
#
# Pilot first (S4 §3, ~18 runs / ~$3):
#   python -m experiments.executor_analysis.runners.collect_executor_tier_dataset \
#     --config experiments/executor_analysis/configs/executor_tier_dataset_v2_collection.yaml \
#     --collection-id pilot_001 --slots pair_01a,pair_01b --repeats 2

# Models (S4 §2.1). The consumer side is one deliberate choice - requirement
# generation and evaluation both run openai/gpt-5.4-mini, the executor's model -
# and every collection manifest records all three under "models" plus the effort
# caps under "effort_caps". Override per run if needed:
#   SERVICE_GENERATION_MODEL - requirement generation
#   EVALUATOR_MODEL          - the quality judge
#   SERVICE_LLM_MODEL        - service execution (default: the architecture's service_llm)
#
# Effort caps (S4 §2.2) are tuned in the pilot, not here, via
# SERVICE_MAX_RETRIEVAL_ROUNDS_{LOW,MEDIUM,HIGH} and SERVICE_MAX_TOOL_CALLS_*.
# Changing them changes the design: the collector warns and records
# effort_caps_match_design=false so S3's n80 gets re-derived rather than assumed.

executor_tier_dataset_collection:
  dataset_id: "executor_tier_dataset_v3"
  collection_id: "v3_pilot_001"

  # Corpus v2 (S3 §0) - each PDF has a matching .txt abstract.
  source_pdf_dir: "utils/files/v2"
  file_glob: "*.pdf"

  # Requirements come from the S3 plan, not from PDF sampling.
  requirement_source: "plan_driven"
  plan_path: "experiments/estimation/requirement_plan_v2.json"
  # Optional subsets - leave empty for all 30 slots. Both also settable via
  # --slots / --splits for the pilot.
  plan_slot_ids: []
  plan_splits: []

  # Prompt length control (S4 §1b): realized total chars must land within
  # +/- prompt_char_tolerance of the slot's target band, else regenerate.
  prompt_char_tolerance: 0.15
  # Raised 3 -> 5 after Stage A1: 4 of 20 slots missed their band, and the
  # misses were depth-correlated (deep overshoot, shallow undershoot), which is
  # exactly the length leak S3's design removes on paper.
  prompt_generation_max_attempts: 5

  # Arm 007's realized effort budget (S4 §3). Effort is an evidence budget —
  # searches x passages per search — because the round count alone is near-binary:
  # two rounds saturate every depth, so {1,3,10} with a fixed k gave no middle tier.
  # Applied to the runtime config at startup, so a run reproduces without env vars.
  # Changing these changes the design: the collector records them per collection and
  # flags effort_caps_match_design=false, and S3's sweep must be re-run (§6.3).
  effort_budget:
    retrieval_rounds: {low: 1, medium: 3, high: 8}
    tool_calls: {low: 1, medium: 3, high: 8}
    retrieval_k: {low: 2, medium: 4, high: 8}

  # Stable append-only dataset root and per-collection artifact root
  output_dataset_dir: "experiments/executor_analysis/data/datasets"
  output_artifacts_dir: "experiments/executor_analysis/data/artifacts"

  # Provider execution profile. Give each parallel worker its own workspace_dir:
  # concurrent RAG index rebuilds in one directory corrupt each other (S4 §4).
  workspace_dir: "workspaces/executor_analysis_v3"
  provider_agent_id: "executor-tier-dataset-v2-provider"
  architecture: "1"
  # v3 is medium-only: S7's market uses the medium tier and nothing else, and
  # dropping low/high cuts the rebuild from $21.45 to $6.54.
  effort_tiers:
    - "medium"

  # 30 slots x 1 tier x 3 repeats = 90 runs, matching v2's finalized medium cell
  # so the randomised repeat selection in S7 still has three recordings to draw.
  executor_repeats_per_requirement: 3
  # Must stay false: repeats share a requirement, or per-cell variance mixes
  # task variation with execution noise (S4 §4).
  regenerate_requirement_each_repeat: false

  # Unused in plan_driven mode, kept for the shared config shape.
  requirement_count: 30
  pdfs_per_service: 5
  service_generation_mode: "random_iterations"
  service_generation_seed: 2026
  allow_pdf_reuse: true
  shuffle: false
  random_seed: 42

  # Runtime controls
  force_rebuild_rag: true
  reset_executor_between_runs: false
  include_partial_fallback_runs: true

  # Evaluator observability
  heartbeat_interval_seconds: 30
  evaluation_timeout_seconds: 180

  # Overwrite only this collection_id if it already exists
  overwrite: false
